services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_NAME: "Auth System"
      APP_URL: ${APP_URL:?Set APP_URL to the public HTTPS API URL}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL to the public HTTPS frontend URL}

      # SQLite — absolute path inside container
      DATABASE_URL: "file:/app/data/auth.db"

      # Production secrets are required; never use checked-in fallback values.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set a unique random JWT_ACCESS_SECRET of at least 32 characters}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set a unique random JWT_REFRESH_SECRET of at least 32 characters}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d

      ARGON2_MEMORY_COST: 65536
      ARGON2_TIME_COST: 3
      ARGON2_PARALLELISM: 4

      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax

      CSRF_SECRET: ${CSRF_SECRET:?Set a unique random CSRF_SECRET of at least 32 characters}
      CSRF_COOKIE_NAME: x-csrf-token
      CSRF_HEADER_NAME: x-csrf-token

      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 100
      AUTH_RATE_LIMIT_MAX: 10

      EMAIL_ENABLED: "false"
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@example.com}
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    volumes:
      - sqlite_data:/app/data

volumes:
  sqlite_data:
    driver: local
